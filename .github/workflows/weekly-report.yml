name: Social report every two weeks

on:
  schedule:
    # Every Thursday 18:00 UTC = 21:00 Riyadh. The job then sends only every
    # other Thursday, starting 5 Nov 2026: 5 Nov, 19 Nov, 3 Dec, and so on.
    - cron: "0 18 * * 4"
  workflow_dispatch:
    inputs:
      skip_email:
        description: "Skip sending the email"
        type: boolean
        default: false

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Send every second Thursday at 9 PM Al Jouf
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: sending."
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          anchor=2026-11-05
          if [[ "$today" < "$anchor" ]]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "$today is before the first Thursday send on $anchor."
            exit 0
          fi
          days=$(( ( $(date -u -d "$today" +%s) - $(date -u -d "$anchor" +%s) ) / 86400 ))
          if [ $((days % 14)) -eq 0 ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "Thursday $today: sending the report."
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "Thursday $today: skipping until the next two-week Thursday."
          fi

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.send == 'true'
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.send == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.cadence.outputs.send == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Chromium for the PDF
        if: steps.cadence.outputs.send == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      # The database in the repo is what the public dashboard reads. Do not
      # restore an Actions cache over it.

      - name: Require the collection secrets
        if: steps.cadence.outputs.send == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "APIFY_TOKEN is not saved in the repository secrets, so this job cannot collect."
            exit 1
          fi
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP_PASSWORD is not saved in the repository secrets, so this job cannot email."
            exit 1
          fi

      - name: Run pipeline
        if: steps.cadence.outputs.send == 'true'
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Recipients are email.recipients in config/settings.yaml, which the
          # control page edits. Do not set EMAIL_RECIPIENTS here or it would
          # hide that list.
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL != '' && vars.DASHBOARD_URL || 'https://aljoufreports-mr5e35jqhtlstznnrrmrnf.streamlit.app/' }}
        run: |
          python -m aljouf_report run ${{ inputs.skip_email && '--skip-email' || '' }}

      - name: Publish the updated database
        if: success() && steps.cadence.outputs.send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aljouf.db
          if git diff --cached --quiet; then
            echo "Database unchanged."
          else
            git commit -m "Update the collected database after the scheduled run."
            git push
          fi

      - name: Upload logs and database
        if: always() && steps.cadence.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            logs/
            data/
          retention-days: 30
          if-no-files-found: ignore
