name: Weekly social media report

on:
  schedule:
    # Sundays 06:00 UTC = 09:00 Riyadh (AST, UTC+3). Sunday is the start of
    # the Saudi work week.
    - cron: "0 6 * * 0"
    # The source brief also asks for the 1st and 15th at 09:00 Riyadh.
    # Uncomment to add that cadence alongside the weekly run.
    # - cron: "0 6 1,15 * *"
  workflow_dispatch:
    inputs:
      skip_email:
        description: "Skip sending the email"
        type: boolean
        default: false

concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install Chromium for the PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium

      # The database in the repo is what the public dashboard reads. Do not
      # restore an Actions cache over it.

      - name: Run pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_RECIPIENTS: ${{ vars.EMAIL_RECIPIENTS != '' && vars.EMAIL_RECIPIENTS || 'ajkattan@jsdo.gov.sa,wakeelsaleh@gmail.com,a.shuqair@jsdo.gov.sa,exc.social@jsdo.gov.sa,laith.louid@jo.ey.com' }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL != '' && vars.DASHBOARD_URL || 'https://aljoufreports-mr5e35jqhtlstznnrrmrnf.streamlit.app/' }}
        run: |
          python -m aljouf_report run ${{ inputs.skip_email && '--skip-email' || '' }}

      - name: Publish the updated database
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aljouf.db
          if git diff --cached --quiet; then
            echo "Database unchanged."
          else
            git commit -m "Update the collected database after the weekly run."
            git push
          fi

      - name: Upload logs and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts
          path: |
            logs/
            data/
          retention-days: 30
          if-no-files-found: ignore
