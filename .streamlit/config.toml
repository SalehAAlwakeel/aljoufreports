# Pin a light theme: the dashboard's custom CSS (metric cards, comment cards,
# chart backgrounds) is designed for light surfaces, and inheriting the
# visitor's OS dark mode makes that text unreadable.
[theme]
base = "light"
primaryColor = "#118a6e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f8f7"
textColor = "#263238"
font = "'IBM Plex Sans Arabic':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"

[server]
headless = true

[browser]
gatherUsageStats = false
